services:
  govote:
    image: ghcr.io/waldirborbajr/govote:latest
    container_name: govote
    restart: unless-stopped
    ports:
      - "9080:9080"   # HTTP (redireciona para HTTPS)
      - "8443:8443"   # HTTPS
    volumes:
      # Diretório, não arquivo: evita o Docker criar um diretório vazio no
      # lugar de votes.db no primeiro `up` (o bug do bind mount de arquivo
      # único que não existe ainda no host). Guarda votes.db, cert.pem e
      # key.pem juntos, então o certificado TLS autoassinado também
      # sobrevive a um `docker compose up --force-recreate`.
      - ./data:/data
    # Limites de recurso — importantes num Raspberry Pi com pouca RAM
    # (Pi 3 = 1GB total). O binário Go em si usa pouco (o app é leve e
    # sem CGO), mas sem limite um vazamento ou pico de tráfego pode
    # comer RAM que o resto do sistema (SSH, outros containers) precisa.
    # Ajuste conforme o modelo:
    #   Pi 3 (1GB RAM total)  -> mem_limit: 128m
    #   Pi 4/5 (4GB+ RAM)     -> pode subir para 256m-512m sem problema
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "1.0"
    environment:
      - TZ=America/Sao_Paulo
      # Runtime do Go faz GC de forma proativa perto desse teto, em vez de
      # deixar o kernel matar o processo com OOM killer quando bater no
      # mem_limit acima. Deixe ~20% abaixo do mem_limit como margem.
      - GOMEMLIMIT=100MiB
      # Obrigatório em produção: gere valores aleatórios longos, ex.
      # `openssl rand -hex 32`, e nunca reutilize os defaults de dev.
      - GOVOTE_JWT_SECRET=${GOVOTE_JWT_SECRET}
      - GOVOTE_CPF_PEPPER=${GOVOTE_CPF_PEPPER}
      # Só defina como "true" se houver um proxy reverso confiável na frente
      # (nginx, Caddy, Traefik, Cloudflare etc.) que sobrescreve
      # X-Forwarded-For/X-Real-IP. Caso contrário, o rate limiter pode ser
      # burlado forjando esses headers.
      # Usado só para calcular turnout_pct em /admin/stats. Ainda não vem de
      # uma fonte real de eleitores elegíveis — ver TODO no PR.
      - GOVOTE_TOTAL_ELIGIBLE_VOTERS=1000
      - GOVOTE_RATE_LIMIT_MAX=10
      - GOVOTE_RATE_LIMIT_WINDOW_SEC=60
      - GOVOTE_TRUST_PROXY_HEADERS=false   # true só atrás de proxy confiável
      # Super-admin inicial (só se a tabela admin estiver vazia). Sem senha:
      # login via OTP/senha temporária e needs_change=1 no primeiro acesso.
      - GOVOTE_BOOTSTRAP_PHONE=${GOVOTE_BOOTSTRAP_PHONE:-}
      - GOVOTE_BOOTSTRAP_USERNAME=${GOVOTE_BOOTSTRAP_USERNAME:-super}
      - GOVOTE_BOOTSTRAP_NAME=${GOVOTE_BOOTSTRAP_NAME:-Super Admin}
      # Lockout por identidade (além do rate limit por IP)
      - GOVOTE_LOCKOUT_MAX_FAILURES=5
      - GOVOTE_LOCKOUT_MINUTES=15
      # CORS allowlist (vírgula). Vazio = sem CORS (somente same-origin). Nunca use *.
      - GOVOTE_CORS_ORIGINS=${GOVOTE_CORS_ORIGINS:-}
      # Limite de body (UI forms + API). Default 1MiB.
      - GOVOTE_MAX_BODY_BYTES=1048576
