worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    # Upstream com health-check ativo (nginx comercial usa health; no open-source
    # usamos max_fails + fail_timeout + endpoint /health no app).
    upstream govote_backend {
        least_conn;
        server govote-1:9080 max_fails=2 fail_timeout=10s;
        server govote-2:9080 max_fails=2 fail_timeout=10s;
        server govote-3:9080 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # Limit básico na borda (complementa Redis rate-limit)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            proxy_pass http://govote_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://govote_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
