# golangci-lint v2 (a partir de v2 o campo "version" é obrigatório).
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck   # inclui o antigo gosimple (removido como linter separado na v2)
    - errcheck
    - ineffassign
    - unused
    - revive
    - gocritic

# Sem presets: equivale ao antigo "exclude-use-default: false".
