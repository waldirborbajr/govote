name: CI/CD Go - Build & Deploy Docker

on:
  push:
    branches: [ main ]
    # Só dispara automaticamente se algo que afeta o build/deploy mudou.
    # Mudanças em docs, imagens, README, etc. não acionam o pipeline.
    # workflow_dispatch (disparo manual) ignora esse filtro e sempre funciona.
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - '.github/workflows/**'
      # Assets embutidos via go:embed (htmx, CSS vendorizado) — afetam
      # o binário final mesmo não sendo .go.
      - 'internal/web/static/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - '.github/workflows/**'
      - 'internal/web/static/**'
  workflow_dispatch:

# Evita dois deploys rodando ao mesmo tempo na mesma VPS se dois pushes
# chegarem em sequência rápida.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Lê a versão direto do go.mod em vez de duplicar o número aqui.
          go-version-file: go.mod

      - name: Rodar testes
        run: go test ./... -v

      - name: go vet
        run: go vet ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Roda em push direto na main OU quando disparado manualmente
    # (workflow_dispatch) na main. Nunca em pull_request.
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Alvo é o Raspberry Pi (aarch64). O Dockerfile usa o truque
          # --platform=$BUILDPLATFORM no estágio de build, então isto
          # faz cross-compile nativo (sem QEMU) em vez de emular arm64
          # inteiro no runner amd64 — bem mais rápido.
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/waldirborbajr/${{ github.event.repository.name }}:latest
            ghcr.io/waldirborbajr/${{ github.event.repository.name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesma condição do build-and-push: push direto na main ou disparo
    # manual na main. Nunca em pull_request ou outras branches.
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      # Necessário para o docker-compose.yaml existir no runner antes do SCP.
      - uses: actions/checkout@v7

      # Entra no tailnet como nó efêmero. Depois deste passo o runner
      # enxerga o Pi pelo IP/hostname Tailscale.
      - name: Conectar ao tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Precisa listar exatamente o mesmo conjunto de tags autorizado
          # no OAuth client (Trust credentials → Scopes → Tags). Pedir
          # só um subconjunto (ex: "tag:ci" quando o client tem
          # "tag:ci tag:rasp") é rejeitado pela API do Tailscale.
          tags: tag:ci,tag:rasp

      - name: Debug - conectividade com o Pi
        run: |
          echo "--- VPS_HOST usado (mascarado pelo GH, mas confirmamos tamanho) ---"
          echo -n "${{ secrets.VPS_HOST }}" | wc -c
          echo "--- tailscale status ---"
          tailscale status
          echo "--- resolvendo/pingando o host ---"
          tailscale ping -c 3 "${{ secrets.VPS_HOST }}" || true
          echo "--- teste TCP na porta 22 ---"
          nc -zv -w5 "${{ secrets.VPS_HOST }}" 22 || true
          echo "--- ssh manual verboso ---"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          timeout 20 ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo conectou" 2>&1 | tail -80 || true
          rm -f /tmp/deploy_key

      - name: Garantir pasta de deploy no Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p "$HOME/ghdeploy/govote/data"
            # O container roda como UID 65532 (não-root, imagem scratch).
            # Sem isso, o SQLite falha com "unable to open database file (14)"
            # porque o diretório pertence a $USER (ex: borba) com modo 755.
            sudo chown -R 65532:65532 "$HOME/ghdeploy/govote/data"

      - name: Copiar docker-compose.yaml para o Pi
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yaml"
          target: "ghdeploy/govote"
          overwrite: true
          strip_components: 0

      - name: Deploy no Servidor via SSH (via Tailscale)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "$HOME/ghdeploy/govote"

            IMAGE="ghcr.io/waldirborbajr/govote:${{ github.sha }}"
            echo "🔄 Baixando imagem $IMAGE ..."
            docker pull "$IMAGE"

            # Atualiza a tag latest localmente (útil se o compose usar :latest)
            docker tag "$IMAGE" "ghcr.io/waldirborbajr/govote:latest"

            echo "♻️ Reiniciando containers..."
            # --force-recreate garante que mudanças de env/config sejam aplicadas
            # --remove-orphans remove containers de serviços que saíram do compose
            docker compose up -d --force-recreate --remove-orphans

            echo "🧹 Limpando imagens antigas (mais de 24h)..."
            docker image prune -f --filter "until=24h" || true

            echo "✅ Deploy concluído com sucesso!"

      # Health check — ajuste a URL/porta conforme o seu app
      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "$HOME/ghdeploy/govote"

            # Ajuste a URL abaixo para o endpoint real do govote
            HEALTH_URL="http://localhost:9080/health"

            for i in $(seq 1 12); do
              if curl -sf --max-time 3 "$HEALTH_URL" > /dev/null 2>&1; then
                echo "✅ Health check OK"
                exit 0
              fi
              echo "Aguardando app subir... ($i/12)"
              sleep 5
            done

            echo "❌ Health check falhou após 60s"
            echo "--- Últimos logs ---"
            docker compose logs --tail=80 || true
            exit 1
