name: CI/CD Go - Build & Deploy Docker
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
# Evita dois deploys rodando ao mesmo tempo na mesma VPS se dois pushes
# chegarem em sequência rápida.
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Lê a versão direto do go.mod (hoje "1.26") em vez de duplicar
          # o número aqui — evita o job de teste ficar quebrado sempre que
          # o go.mod for atualizado e alguém esquecer de mudar este arquivo
          # também (foi exatamente o que quebrou o build local antes).
          go-version-file: go.mod
          # actions/setup-go já cacheia ~/go/pkg/mod e o build cache do Go
          # sozinho quando cache: true (padrão), então o passo manual de
          # actions/cache abaixo era redundante e foi removido.
      - name: Rodar testes
        run: go test ./... -v
      - name: go vet
        run: go vet ./...
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Alvo é o Raspberry Pi (aarch64). O Dockerfile usa o truque
          # --platform=$BUILDPLATFORM no estágio de build, então isto
          # faz cross-compile nativo (sem QEMU) em vez de emular arm64
          # inteiro no runner amd64 — bem mais rápido.
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/waldirborbajr/${{ github.event.repository.name }}:latest
            ghcr.io/waldirborbajr/${{ github.event.repository.name }}:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Necessário para o docker-compose.yaml existir no runner antes do
      # passo de SCP abaixo — o job deploy roda em runner limpo, sem
      # nenhum arquivo do repo por padrão.
      - uses: actions/checkout@v4
      # Entra no seu tailnet como um nó efêmero — some sozinho do
      # Tailscale assim que este job termina. Depois deste passo, o
      # runner enxerga o Pi pelo IP/hostname do Tailscale (100.x.y.z ou
      # nome.tailXXXX.ts.net), mesmo que a porta 22 do Pi não esteja
      # exposta pra internet pública.
      - name: Conectar ao tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Garantir pasta de deploy no Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p "$HOME/ghdeploy/govote/data"

      - name: Copiar docker-compose.yaml para o Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          # Mesmo host/credenciais do passo SSH — a conexão já está
          # dentro do tailnet graças ao passo "Conectar ao tailnet" acima.
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yaml"
          target: "ghdeploy/govote"
          overwrite: true
          strip_components: 0

      - name: Deploy no Servidor via SSH (via Tailscale)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Agora deve ser o IP (100.x.y.z) ou o hostname MagicDNS do Pi
          # dentro do tailnet — não mais o IP público. Veja com
          # `tailscale status` rodando no Pi, ou no admin console.
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            # $HOME resolve para /home/borba na sessão SSH (VPS_USER=borba).
            # Estrutura: ~/ghdeploy/<nome-do-projeto>/docker-compose.yaml
            # Isso permite hospedar vários projetos no mesmo Pi, cada um
            # com sua própria pasta e docker-compose.yaml.
            cd "$HOME/ghdeploy/govote"
            echo "🔄 Baixando nova imagem..."
            docker compose pull
            echo "♻️ Reiniciando containers..."
            docker compose up -d
            echo "🧹 Limpando recursos antigos..."
            docker image prune -f
            echo "✅ Deploy concluído com sucesso!"
